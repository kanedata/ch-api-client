[project]
name = "ch-api-client"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [{ name = "David Kane", email = "david@dkane.net" }]
requires-python = ">=3.11"
dependencies = [
    "click>=8.5.0",
    "httpx2>=2.13.1",
    "mypy>=2.4.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
]

[project.scripts]
ch-api-client = "ch_api_client:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "coverage>=7.16.2",
    "faker>=40.43.0",
    "httpx2-pytest>=2.0.0",
    "pytest>=9.1.1",
    "pyyaml>=6.0.3",
    "ruff>=0.17.0",
]

[tool.ruff.lint.per-file-ignores]
"src/ch_api_client/models/ch_enums.py" = ["E501"]
